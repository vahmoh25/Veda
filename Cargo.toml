    "drivers/ac97",
    "services/audio",
    "tools/assetgen",
    "tools/musicgen",
    "tools/airsim",
    "drivers/virtio-input",
    "drivers/ps2",
    "drivers/virtio-blk",
    "drivers/virtio-gpu",
