[workspace]
resolver = "3"
members = [
    "xtask",
    "boot",
    "kernel",
    "lib/abi",
    "lib/bootinfo",
    "lib/initrd",
    "lib/pe",
    "lib/math",
    "lib/raster",
    "lib/font",
    "lib/image",
    "lib/heap",
    "lib/build",
    "lib/rt",
    "lib/ipc",
    "lib/proto",
    "lib/virtio",
    "lib/gfx",
    "lib/ui",
    "lib/text",
    "lib/files",
    "lib/v3d",
    "lib/audio",
    "lib/entropy",
    "lib/netstack",
    "lib/net",
    "services/init",
    "services/vfs",
    "services/devmgr",
    "services/compositor",
    "services/netd",
    "apps/about",
    "apps/shell",
    "apps/editor",
    "apps/photos",
    "apps/music",
    "apps/terminal",
    "apps/taskmgr",
    "apps/files",
    "apps/settings",
    "apps/racer",
    "apps/starfall",
    "drivers/virtio-snd",
    "services/audio",
    "tools/assetgen",
    "tools/musicgen",
    "drivers/virtio-input",
    "drivers/ps2",
    "drivers/virtio-blk",
    "drivers/virtio-net",
    "tests/systest",
    "tests/nettest",
]
# Vendored third-party crates are path dependencies, not members (their own
# tests and dev-dependencies stay out of this workspace). See third_party/.
exclude = ["third_party"]
# Plain `cargo build` only builds the host-side build tool. Everything that runs
# inside Vindows is cross-built by `cargo xtask build`, which knows the correct
# target for every component.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Vahid Mohammadi"]
repository = "https://github.com/vahmoh25/Vindows"

[workspace.dependencies]
vabi = { path = "lib/abi" }
bootinfo = { path = "lib/bootinfo" }
initrd = { path = "lib/initrd" }
vpe = { path = "lib/pe" }
vmath = { path = "lib/math" }
vraster = { path = "lib/raster" }
vfont = { path = "lib/font" }
vimage = { path = "lib/image" }
vheap = { path = "lib/heap" }
vbuild = { path = "lib/build" }
vrt = { path = "lib/rt" }
vipc = { path = "lib/ipc" }
vproto = { path = "lib/proto" }
vvirtio = { path = "lib/virtio" }
vgfx = { path = "lib/gfx" }
vui = { path = "lib/ui" }
vtext = { path = "lib/text" }
vfiles = { path = "lib/files" }
v3d = { path = "lib/v3d" }
vaudio = { path = "lib/audio" }
ventropy = { path = "lib/entropy" }
vnetstack = { path = "lib/netstack" }
vnet = { path = "lib/net" }
# HTTP/1.x message parsing (no_std).
httparse = { version = "1.10", default-features = false }
# The TCP/IP stack (vendored with a security patch, see third_party/).
smoltcp = { path = "third_party/smoltcp", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv4-fragmentation",
    "proto-dhcpv4",
    "proto-ipv6",
    "proto-ipv6-slaac",
    "proto-dns",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-dhcpv4",
    "multicast",
    "auto-icmp-echo-reply",
    "iface-max-addr-count-6",
    "iface-max-route-count-8",
    "iface-max-prefix-count-2",
    "iface-neighbor-cache-count-32",
    "iface-max-multicast-group-count-8",
    "assembler-max-segment-count-8",
    "reassembly-buffer-size-4096",
    "reassembly-buffer-count-4",
    "fragmentation-buffer-size-4096",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
missing_safety_doc = "allow"
new_without_default = "allow"
# Drawing functions take a canvas, font, size, position, text and colour;
# bundling those into structs would only obscure the call sites.
too_many_arguments = "allow"

# The OS is always built with `panic = "abort"`: there is no unwinder in
# Vindows. (Cargo ignores this for `cargo test`, which needs unwinding.)
[profile.dev]
panic = "abort"
# Unoptimised code is unusably slow under QEMU's TCG emulation.
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
debug = false
codegen-units = 16
