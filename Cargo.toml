    "drivers/lpss-spi",
    "drivers/intel-gpu",
    "drivers/flipsim",
    "drivers/gemsim",
    "tests/systest",
    "tests/nettest",
    "tests/testmic",
    "tests/audiotest",
    "tests/speakertest",
    "guest/init",
    "guest/bridgetest",
    "guest/pcitest",
    "guest/sys",
    "guest/alsa",
    "guest/net",
    "guest/netlink",
    "guest/wifi",
    "guest/airlink",
    "guest/kms",
    "guest/usb",
]
# Vendored third-party crates are path dependencies, not members (their own
# tests and dev-dependencies stay out of this workspace). See third_party/.
exclude = ["third_party"]
# Plain `cargo build` only builds the host-side build tool. Everything that runs
# inside Veda is cross-built by `cargo xtask build`, which knows the correct
# target for every component.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Vahid Mohammadi"]
repository = "https://github.com/vahmoh25/Veda"

[workspace.dependencies]
vabi = { path = "lib/abi" }
bootinfo = { path = "lib/bootinfo" }
initrd = { path = "lib/initrd" }
vpe = { path = "lib/pe" }
velf = { path = "lib/elf" }
vposix = { path = "lib/posix" }
vmath = { path = "lib/math" }
vraster = { path = "lib/raster" }
vfont = { path = "lib/font" }
vimage = { path = "lib/image" }
vheap = { path = "lib/heap" }
vbuild = { path = "lib/build" }
vrt = { path = "lib/rt" }
vipc = { path = "lib/ipc" }
vproto = { path = "lib/proto" }
vvirtio = { path = "lib/virtio" }
vgfx = { path = "lib/gfx" }
vui = { path = "lib/ui" }
vtext = { path = "lib/text" }
vfiles = { path = "lib/files" }
v3d = { path = "lib/v3d" }
vaudio = { path = "lib/audio" }
ventropy = { path = "lib/entropy" }
vnetstack = { path = "lib/netstack" }
vnet = { path = "lib/net" }
vtls = { path = "lib/tls" }
vwlan = { path = "lib/wlan" }
vradiolink = { path = "lib/radiolink" }
vjson = { path = "lib/json" }
vweb = { path = "lib/web" }
vagent = { path = "lib/agent" }
vusb = { path = "lib/usb" }
vhda = { path = "lib/hda" }
vacpi = { path = "lib/acpi" }
vcs35l41 = { path = "lib/cs35l41" }
vigpu = { path = "lib/igpu" }
vgem = { path = "lib/gem" }
vgpio = { path = "lib/gpio" }
vspi = { path = "lib/spi" }
vsplash = { path = "lib/splash" }
vglsl = { path = "lib/glsl" }
vgl = { path = "lib/gl" }
vhv = { path = "lib/hv" }
viommu = { path = "lib/iommu" }
guest-sys = { path = "guest/sys" }
guest-netlink = { path = "guest/netlink" }
# Cryptography for Wi-Fi security (RustCrypto, all no_std, pure Rust).
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hkdf = { version = "0.13", default-features = false }
aes = { version = "0.9", default-features = false }
ccm = { version = "0.6", default-features = false }
cmac = { version = "0.8", default-features = false }
aes-kw = { version = "0.3", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "hash2curve"] }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.9", default-features = false }
# TLS (HTTPS, secure WebSockets): rustls, with a CryptoProvider built on the
# RustCrypto crates (lib/tls). Same RustCrypto generation as above.
rustls = { version = "0.23.45", default-features = false, features = ["tls12", "custom-provider"] }
webpki-roots = { version = "1.0.9", default-features = false }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "3", default-features = false }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh"] }
crypto-bigint = { version = "0.7.5", default-features = false, features = ["alloc"] }
# HTTP/1.x message parsing (no_std).
httparse = { version = "1.10", default-features = false }
# The TCP/IP stack (vendored with a security patch, see third_party/).
smoltcp = { path = "third_party/smoltcp", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv4-fragmentation",
    "proto-dhcpv4",
    "proto-ipv6",
    "proto-ipv6-slaac",
    "proto-dns",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-dhcpv4",
    "multicast",
    "auto-icmp-echo-reply",
    "iface-max-addr-count-6",
    "iface-max-route-count-8",
    "iface-max-prefix-count-2",
    "iface-neighbor-cache-count-32",
    "iface-max-multicast-group-count-8",
    "assembler-max-segment-count-8",
    "reassembly-buffer-size-4096",
    "reassembly-buffer-count-4",
    "fragmentation-buffer-size-4096",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Set for the programs of the driver VM's Linux guest (.cargo/config.toml).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(veda_guest)"] }
missing_debug_implementations = "allow"

[workspace.lints.clippy]
missing_safety_doc = "allow"
new_without_default = "allow"
# Drawing functions take a canvas, font, size, position, text and colour;
# bundling those into structs would only obscure the call sites.
too_many_arguments = "allow"

# The OS is always built with `panic = "abort"`: there is no unwinder in
# Veda. (Cargo ignores this for `cargo test`, which needs unwinding.)
[profile.dev]
panic = "abort"
# Unoptimised code is unusably slow under QEMU's TCG emulation.
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
debug = false
codegen-units = 16
