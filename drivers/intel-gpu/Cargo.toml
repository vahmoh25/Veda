[package]
name = "intel-gpu"
description = "Driver for Intel integrated graphics (Tiger Lake to Raptor Lake): the display (the firmware's mode kept, frames flipped at the vertical blank) and the render and copy engines, served to the renderer as GEM"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "intel-gpu"
test = false
bench = false

[dependencies]
vrt = { workspace = true }
vabi = { workspace = true }
vproto = { workspace = true }
vigpu = { workspace = true }
vgem = { workspace = true }

[build-dependencies]
vbuild = { workspace = true }

[lints]
workspace = true
