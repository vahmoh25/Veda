[alias]
# `cargo xtask <command>` drives every development workflow (build, run, test).
xtask = "run --quiet --package xtask --"

# The UEFI target is soft-float: LLVM cannot build the SIMD code (AES-NI,
# SSE2, AVX2) of the RustCrypto and dalek crates for it. Nothing that runs on
# that target uses them, but the no_std check of the libraries
# (`cargo build -p <crate> --target x86_64-unknown-uefi`) compiles them:
# select their portable implementations there. User space is unaffected.
[target.x86_64-unknown-uefi]
rustflags = [
    "--cfg", "aes_backend=\"soft\"",
    "--cfg", "polyval_backend=\"soft\"",
    "--cfg", "chacha20_backend=\"soft\"",
    "--cfg", "poly1305_backend=\"soft\"",
    "--cfg", "sha1_backend=\"soft\"",
    "--cfg", "sha2_backend=\"soft\"",
    "--cfg", "curve25519_dalek_backend=\"serial\"",
]
